<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Scratch Video HSV Converter</title>

<style>
body {
  background:#222;
  color:#fff;
  font-family:sans-serif;
  text-align:center;
}
.container {
  background:#333;
  padding:20px;
  border-radius:10px;
  display:inline-block;
  border:2px solid #4C97FF;
}
canvas {
  background:white;
  image-rendering:pixelated;
  margin:10px 0;
}
button {
  background:#4C97FF;
  color:white;
  border:none;
  padding:12px 25px;
  font-size:16px;
  font-weight:bold;
  border-radius:6px;
  cursor:pointer;
}
select {
  font-size:16px;
}
</style>
</head>

<body>
<div class="container">
  <h2>動画 → Scratch HSV（3行1セット）</h2>

  <input type="file" id="videoInput" accept="video/*"><br><br>

  サイズ：
  <select id="sizeSelect">
    <option value="360">360×360</option>
    <option value="180">180×180</option>
  </select><br><br>

  <canvas id="canvas"></canvas><br>

  <button onclick="convert()">変換開始</button>
  <p id="status">動画を選択してね</p>
</div>

<script>
const FPS = 10;
const MAX_TIME = 5;

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const status = document.getElementById("status");

const video = document.createElement("video");
video.muted = true;
video.playsInline = true;

document.getElementById("videoInput").addEventListener("change", e => {
  video.src = URL.createObjectURL(e.target.files[0]);
  status.innerText = "動画読み込み完了";
});

function convert() {
  if (!video.src) {
    alert("動画選んで");
    return;
  }

  const SIZE = Number(document.getElementById("sizeSelect").value);
  canvas.width = SIZE;
  canvas.height = SIZE;

  const start = () => {
    let output = [];
    let frameIndex = 0;

    const totalFrames =
      Math.floor(Math.min(video.duration, MAX_TIME) * FPS);

    function nextFrame() {
      if (frameIndex >= totalFrames) {
        download(output.join("\n"));
        status.innerText = "変換完了！";
        return;
      }

      video.currentTime = frameIndex / FPS;
      video.onseeked = () => {
        const drawHeight = drawVideo(SIZE);
        const frame = captureFrame(drawHeight, SIZE);
        output.push(frameToText(frame));
        frameIndex++;
        status.innerText = `変換中 ${frameIndex}/${totalFrames}`;
        nextFrame();
      };
    }
    nextFrame();
  };

  if (video.readyState >= 1) start();
  else video.onloadedmetadata = start;
}

function drawVideo(SIZE) {
  ctx.clearRect(0, 0, SIZE, SIZE);

  const scale = SIZE / video.videoWidth;
  const drawHeight = Math.floor(video.videoHeight * scale);

  ctx.drawImage(video, 0, 0, SIZE, drawHeight);
  return drawHeight;
}

function captureFrame(drawHeight, SIZE) {
  const img = ctx.getImageData(0, 0, SIZE, drawHeight).data;
  let frame = [];

  for (let y = 0; y < drawHeight; y++) {
    let rowH = [];
    let rowS = [];
    let rowV = [];
    let isWhite = true;

    for (let x = 0; x < SIZE; x++) {
      const i = (y * SIZE + x) * 4;
      const hsv = rgbToScratchHSV(
        img[i], img[i + 1], img[i + 2]
      );

      rowH.push(hsv.h);
      rowS.push(hsv.s);
      rowV.push(hsv.v);

      if (!(hsv.h === 0 && hsv.s === 0 && hsv.v === 100)) {
        isWhite = false;
      }
    }

    if (!isWhite) {
      frame.push(rowH);
      frame.push(rowS);
      frame.push(rowV);
    }
  }
  return frame;
}

function rgbToScratchHSV(r, g, b) {
  r /= 255;
  g /= 255;
  b /= 255;

  const max = Math.max(r, g, b);
  const min = Math.min(r, g, b);
  const d = max - min;

  let h = 0;
  if (d !== 0) {
    if (max === r) h = (g - b) / d + (g < b ? 6 : 0);
    else if (max === g) h = (b - r) / d + 2;
    else h = (r - g) / d + 4;
    h /= 6;
  }

  return {
    h: Math.round(h * 100),
    s: Math.round((max === 0 ? 0 : d / max) * 100),
    v: Math.round(max * 100)
  };
}

function frameToText(frame) {
  let lines = [];
  lines.push(frame.length.toString()); // 行数（3行単位込み）

  for (const row of frame) {
    lines.push(row.join(","));
  }
  return lines.join("\n");
}

function download(text) {
  const blob = new Blob([text], { type: "text/plain" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "scratch_video_hsv_3line.txt";
  a.click();
}
</script>
</body>
</html>
