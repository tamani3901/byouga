<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Scratch Video Converter</title>
<style>
body {
  background:#222; color:white; text-align:center; font-family:sans-serif;
}
.container {
  background:#333; padding:20px; border-radius:10px;
  display:inline-block; border:2px solid #4C97FF;
}
canvas {
  background:white;
  image-rendering:pixelated;
  margin:10px 0;
}
button {
  background:#4C97FF; color:white;
  border:none; padding:12px 25px;
  font-size:16px; font-weight:bold;
  border-radius:6px; cursor:pointer;
}
select { font-size:16px; }
</style>
</head>

<body>
<div class="container">
  <h2>動画 → Scratchテキスト</h2>

  <input type="file" id="videoInput" accept="video/*"><br><br>

  サイズ：
  <select id="sizeSelect">
    <option value="360">360×360</option>
    <option value="180">180×180</option>
  </select><br><br>

  <canvas id="canvas"></canvas><br>
  <button onclick="convert()">変換開始</button>

  <p id="status">動画を選択してね</p>
</div>

<script>
const FPS = 10;
const MAX_TIME = 5; // 秒
const WHITE = 255;

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const status = document.getElementById("status");

let video = document.createElement("video");
video.muted = true;

document.getElementById("videoInput").addEventListener("change", e => {
  video.src = URL.createObjectURL(e.target.files[0]);
  video.load();
});

function convert() {
  const SIZE = Number(document.getElementById("sizeSelect").value);
  canvas.width = SIZE;
  canvas.height = SIZE;

  let output = [];
  let frameIndex = 0;

  video.onloadedmetadata = () => {
    const totalFrames = Math.floor(Math.min(video.duration, MAX_TIME) * FPS);

    function processFrame() {
      if (frameIndex >= totalFrames) {
        download(output.join("\n"));
        status.innerText = "完了！";
        return;
      }

      video.currentTime = frameIndex / FPS;
      video.onseeked = () => {
        const drawHeight = drawVideo(video, SIZE);
        const frame = captureFrame(drawHeight, SIZE);
        output.push(frameToText(frame));
        frameIndex++;
        status.innerText = `変換中 ${frameIndex}/${totalFrames}`;
        processFrame();
      };
    }
    processFrame();
  };
}

function drawVideo(video, SIZE) {
  ctx.clearRect(0, 0, SIZE, SIZE);

  const scale = SIZE / video.videoWidth;
  const drawHeight = Math.floor(video.videoHeight * scale);

  ctx.drawImage(video, 0, 0, SIZE, drawHeight);
  return drawHeight;
}

function captureFrame(drawHeight, SIZE) {
  const img = ctx.getImageData(0, 0, SIZE, drawHeight).data;
  let frame = [];

  for (let y = 0; y < drawHeight; y++) {
    let row = [];
    let isWhite = true;

    for (let x = 0; x < SIZE; x++) {
      const i = (y * SIZE + x) * 4;
      const v = img[i]; // R成分のみ
      row.push(v);
      if (v !== WHITE) isWhite = false;
    }

    if (!isWhite) frame.push(row);
  }
  return frame;
}

function frameToText(frame) {
  let lines = [];
  lines.push(frame.length.toString());
  for (const row of frame) {
    lines.push(row.join(","));
  }
  return lines.join("\n");
}

function download(text) {
  const blob = new Blob([text], {type:"text/plain"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "scratch_video.txt";
  a.click();
}
</script>
</body>
</html>
