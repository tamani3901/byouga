<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Scratch Video Full Color Converter</title>
<style>
body {
    font-family: sans-serif;
    text-align: center;
    background: #222;
    color: #fff;
    padding: 20px;
}
.container {
    background: #333;
    padding: 20px;
    border-radius: 10px;
    display: inline-block;
    border: 2px solid #4C97FF;
}
canvas {
    border: 1px solid #555;
    background: white;
    width: 360px;
    height: 360px;
    image-rendering: pixelated;
    margin: 20px 0;
}
button {
    background: #4C97FF;
    color: white;
    border: none;
    padding: 15px 30px;
    border-radius: 5px;
    cursor: pointer;
    font-size: 18px;
    font-weight: bold;
}
button:active {
    background: #3d85e6;
}
</style>
</head>

<body>
<div class="container">
    <h2>Scratch 動画→テキスト変換（10fps）</h2>
    <p>最大5秒 / 横360固定 / 上詰め / 白帯データなし</p>

    <input type="file" id="upload" accept="video/*"><br>
    <canvas id="canvas"></canvas><br>

    <button onclick="downloadTxt()">テキスト保存</button>
    <p id="status">動画を選択して</p>
</div>

<video id="video" style="display:none"></video>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const video = document.getElementById("video");
const status = document.getElementById("status");

canvas.width = 360;
canvas.height = 360;

let finalData = [];
let valuesPerFrame = 0;
let pixelHeightPerFrame = 0;
let totalFramesGlobal = 0;

const FPS = 10;
const MAX_TIME = 5;

document.getElementById("upload").addEventListener("change", e => {
    const file = e.target.files[0];
    if (!file) return;

    video.src = URL.createObjectURL(file);
    video.load();

    video.onloadedmetadata = async () => {
        const duration = Math.min(video.duration, MAX_TIME);
        const totalFrames = Math.floor(duration * FPS);
        totalFramesGlobal = totalFrames;

        finalData = [];
        valuesPerFrame = 0;
        pixelHeightPerFrame = 0;

        status.innerText = `変換中… ${totalFrames}フレーム`;

        for (let i = 0; i < totalFrames; i++) {
            await seekVideo(i / FPS);
            captureFrame();
            status.innerText = `処理中 ${i + 1}/${totalFrames}`;
        }

        // 1行目：1フレームの総データ数
        // 2行目：ピクセル高さ
        // 3行目：総フレーム数
        finalData.unshift(totalFramesGlobal);
        finalData.unshift(pixelHeightPerFrame);
        finalData.unshift(valuesPerFrame);

        status.innerText = "変換完了";
    };
});

function seekVideo(time) {
    return new Promise(resolve => {
        video.currentTime = time;
        video.onseeked = () => resolve();
    });
}

function captureFrame() {
    ctx.fillStyle = "white";
    ctx.fillRect(0, 0, 360, 360);

    const scale = 360 / video.videoWidth;
    const drawHeight = Math.floor(video.videoHeight * scale);

    ctx.drawImage(video, 0, 0, 360, drawHeight);

    const validHeight = Math.min(drawHeight, 360);
    const pixels = ctx.getImageData(0, 0, 360, validHeight).data;

    let countThisFrame = 0;

    for (let i = 0; i < pixels.length; i += 4) {
        const hsv = rgbToScratchHSV1(
            pixels[i],
            pixels[i + 1],
            pixels[i + 2]
        );
        finalData.push(hsv.h);
        finalData.push(hsv.s);
        finalData.push(hsv.v);
        countThisFrame += 3;
    }

    // 最初の1フレームだけ記録
    if (valuesPerFrame === 0) {
        valuesPerFrame = countThisFrame;
        pixelHeightPerFrame = validHeight;
    }
}

function rgbToScratchHSV1(r, g, b) {
    r /= 255;
    g /= 255;
    b /= 255;

    const max = Math.max(r, g, b);
    const min = Math.min(r, g, b);
    const d = max - min;

    let h = 0;

    if (d !== 0) {
        if (max === r) h = (g - b) / d + (g < b ? 6 : 0);
        else if (max === g) h = (b - r) / d + 2;
        else h = (r - g) / d + 4;
    }

    return {
        h: Math.round((h / 6) * 100),
        s: Math.round((max === 0 ? 0 : d / max) * 100),
        v: Math.round(max * 100)
    };
}

function downloadTxt() {
    const blob = new Blob(
        [finalData.join("\n")],
        { type: "text/plain" }
    );

    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "scratch_video_data.txt";
    a.click();
}
</script>
</body>
</html>
